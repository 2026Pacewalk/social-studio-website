    <style>
      /* Loading screen */
      #loader { position: fixed; inset: 0; z-index: 10000; background: #080808; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.8s ease, visibility 0.8s ease; }
      #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-logo { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: #D4A843; letter-spacing: 0.05em; margin-bottom: 2rem; }
      .loader-bar { width: 120px; height: 1px; background: rgba(212,168,67,0.1); position: relative; overflow: hidden; }
      .loader-bar::after { content: ''; position: absolute; left: -40%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #D4A843, transparent); animation: loaderSlide 1.2s ease-in-out infinite; }
      @keyframes loaderSlide { 0% { left: -40%; } 100% { left: 100%; } }
      .loader-sub { font-family: 'Inter', sans-serif; font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: #5C564D; margin-top: 1.5rem; }
    </style>

    <!-- Loader removal -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('loader');
          if (loader) loader.classList.add('hidden');
        }, 1800);
      });
    </script>
